name: Deploy Flutter Web to ailinks.dropticks.com

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/deploy-flutter-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install -g firebase-tools --no-audit --no-fund
          flutter pub global activate flutterfire_cli

      - name: Generate Firebase options (Web only)
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          flutterfire configure \
            --project=link-ai-0749 \
            --platforms=web \
            --yes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Build web
        run: flutter build web --release -O4 --dart-define=FLAVOR=production

      - name: Verify build output
        run: |
          echo "Build output contents:"
          ls -la build/web/ | head -20

      - name: Deploy to Hetzner server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            set -e
            DEPLOY_DIR="/home/rafiadmin/web/ailinks.dropticks.com/public_html"

            echo "Creating backup..."
            mkdir -p "$DEPLOY_DIR.backup"
            cp -r "$DEPLOY_DIR"/* "$DEPLOY_DIR.backup/" 2>/dev/null || true

            echo "Clearing deployment directory..."
            rm -rf "$DEPLOY_DIR"/*

            echo "Ready for file transfer..."

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          source: 'build/web/*'
          target: '/home/rafiadmin/web/ailinks.dropticks.com/public_html'

      - name: Verify and fix deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            set -e
            DEPLOY_DIR="/home/rafiadmin/web/ailinks.dropticks.com/public_html"

            echo "Checking deployment directory..."
            ls -la "$DEPLOY_DIR" | head -20

            # If files are nested in build/web, move them up
            if [ -d "$DEPLOY_DIR/build/web" ]; then
              echo "Found nested build/web directory, moving files..."
              mv "$DEPLOY_DIR/build/web"/* "$DEPLOY_DIR/"
              rm -rf "$DEPLOY_DIR/build"
              echo "Files moved successfully"
            fi

            # If index.html is still not at root, check for other nested paths
            if [ ! -f "$DEPLOY_DIR/index.html" ]; then
              echo "ERROR: index.html not found in deployment directory"
              ls -laR "$DEPLOY_DIR"
              exit 1
            fi

            echo ""
            echo "✅ Setting permissions..."
            chmod -R 755 "$DEPLOY_DIR"
            chmod 644 "$DEPLOY_DIR"/*.* 2>/dev/null || true

            echo ""
            echo "✅ Verifying deployment:"
            stat "$DEPLOY_DIR/index.html" | grep Modify
            ls -lh "$DEPLOY_DIR/main.dart.js"

            echo ""
            echo "✅ Flutter web deployed successfully to https://ailinks.dropticks.com"

      - name: Notify deployment success
        run: |
          echo "✅ Flutter web deployed to https://ailinks.dropticks.com"
