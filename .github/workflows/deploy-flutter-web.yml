name: Deploy Flutter Web to ailinks.dropticks.com

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/deploy-flutter-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install -g firebase-tools --no-audit --no-fund
          flutter pub global activate flutterfire_cli

      - name: Generate Firebase options (Web only)
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          flutterfire configure \
            --project=link-ai-0749 \
            --platforms=web \
            --yes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release -O4 --dart-define=FLAVOR=production

      - name: Deploy to Hetzner server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          source: 'build/web/*'
          target: '/home/rafiadmin/web/ailinks.dropticks.com/public_html'
          rm: true

      - name: Cleanup and organize files on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            cd /home/rafiadmin/web/ailinks.dropticks.com/public_html

            # If files are in build/web/ subdirectory, move them up
            if [ -d "build/web" ]; then
              echo "Moving files from build/web/ to public_html/"
              mv build/web/* .
              rm -rf build/
              echo "✅ Files organized"
            fi

            # List contents to verify
            ls -la | head -20

      - name: Notify deployment success
        run: |
          echo "✅ Flutter web deployed to https://ailinks.dropticks.com"
