name: Deploy Flutter Web to ailinks.dropticks.com

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/deploy-flutter-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install -g firebase-tools --no-audit --no-fund
          flutter pub global activate flutterfire_cli

      - name: Generate Firebase options (Web only)
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          flutterfire configure \
            --project=link-ai-0749 \
            --platforms=web \
            --yes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release -O4 --dart-define=FLAVOR=production

      - name: Verify build output
        run: |
          echo "Build output contents:"
          ls -la build/web/ | head -20

      - name: Deploy to Hetzner server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            set -e
            DEPLOY_DIR="/home/rafiadmin/web/ailinks.dropticks.com/public_html"

            echo "Creating backup..."
            mkdir -p "$DEPLOY_DIR.backup"
            cp -r "$DEPLOY_DIR"/* "$DEPLOY_DIR.backup/" 2>/dev/null || true

            echo "Clearing deployment directory..."
            rm -rf "$DEPLOY_DIR"/*

            echo "Ready for file transfer..."

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          source: 'build/web/'
          target: '/home/rafiadmin/web/ailinks.dropticks.com/public_html'
          strip_components: 2

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            DEPLOY_DIR="/home/rafiadmin/web/ailinks.dropticks.com/public_html"

            echo "✅ Deployment directory contents:"
            ls -la "$DEPLOY_DIR" | head -20

            if [ -f "$DEPLOY_DIR/index.html" ]; then
              echo "✅ index.html found - deployment successful!"
              echo "✅ Flutter web deployed to https://ailinks.dropticks.com"
            else
              echo "❌ ERROR: index.html not found in public_html"
              exit 1
            fi

      - name: Notify deployment success
        run: |
          echo "✅ Flutter web deployed to https://ailinks.dropticks.com"
